<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Gundam Hangar | Experiência Imersiva Mobile/PC VR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Rajdhani', 'Segoe UI', 'Orbitron', monospace;
            background-color: #050a12;
        }
        
        /* UI Overlay para instruções e controles */
        .vr-ui {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            font-family: 'Rajdhani', monospace;
        }
        
        .info-panel {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            display: inline-block;
            padding: 12px 24px;
            border-radius: 40px;
            border-left: 4px solid #00d4ff;
            border-right: 4px solid #ff3366;
            color: #ccf4ff;
            font-size: 14px;
            letter-spacing: 1.5px;
            font-weight: 500;
            pointer-events: auto;
        }
        
        .info-panel span {
            color: #ff6699;
            font-weight: bold;
        }
        
        .controls-tip {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #88ddff;
            font-family: monospace;
            backdrop-filter: blur(4px);
            z-index: 100;
            pointer-events: none;
            border: 1px solid #00aaff;
        }
        
        .vr-badge {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 30px;
            color: #ffcc44;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 2px;
            z-index: 100;
            backdrop-filter: blur(5px);
            border: 1px solid #ffaa33;
            pointer-events: none;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; text-shadow: 0 0 0px cyan;}
            100% { opacity: 1; text-shadow: 0 0 8px #00ccff;}
        }
        
        .enter-vr-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-family: monospace;
            font-size: 18px;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 0 20px rgba(0,114,255,0.5);
            transition: transform 0.2s;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .enter-vr-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #00e0ff, #0088ff);
            box-shadow: 0 0 30px #00aaff;
        }
        
        @media (max-width: 700px) {
            .info-panel { font-size: 10px; padding: 8px 16px; }
            .controls-tip { display: none; }
        }
    </style>
</head>
<body>
    <div class="vr-badge">
        ⚡ RX-78-2 VR SIMULATOR ⚡
    </div>
    <div class="vr-ui">
        <div class="info-panel">
            🚀 <span>GUNDAM HANGAR VR</span> 🚀 | Arraste para olhar ao redor | Clique no botão VR para imersão total
        </div>
    </div>
    <div class="controls-tip">
        🕹️ MOUSE/TOQUE: Girar visão | 🥽 BOTÃO VR: Ativar headset
    </div>
    <button class="enter-vr-btn" id="vrButton">🔮 ENTRAR NO MODO VR 🥽</button>

    <!-- Import Three.js e addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- Setup Cena VR ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010518);
        scene.fog = new THREE.FogExp2(0x010518, 0.008);
        
        // Câmera principal (para VR e desktop)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 1.8, 5);
        camera.lookAt(0, 1.2, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;  // Habilita VR
        document.body.appendChild(renderer.domElement);
        
        // Efeitos pós-processamento (glow)
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.3, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 0.65;
        bloomPass.radius = 0.5;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // Controles para desktop (orbit, mas compatível com VR)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.0;
        controls.zoomSpeed = 1.2;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.8;
        controls.target.set(0, 1.5, 0);
        
        // Botão VR
        document.getElementById('vrButton').addEventListener('click', () => {
            if (renderer.xr.isPresenting) {
                renderer.xr.getSession()?.end();
            } else {
                renderer.xr.enabled = true;
                const btn = VRButton.createButton(renderer);
                btn.click(); // aciona o pedido de permissão VR
            }
        });
        
        // --- LUZES E AMBIENTE FUTURISTA ---
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);
        
        // Luz principal direcional
        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        mainLight.position.set(2, 5, 3);
        mainLight.castShadow = true;
        mainLight.receiveShadow = true;
        scene.add(mainLight);
        
        // Luz de preenchimento azul
        const fillBlue = new THREE.PointLight(0x2266ff, 0.6);
        fillBlue.position.set(-1, 2, 2);
        scene.add(fillBlue);
        
        // Luz vermelha dramática
        const redLight = new THREE.PointLight(0xff3366, 0.5);
        redLight.position.set(1.5, 1, -2);
        scene.add(redLight);
        
        // Luzes de hangar (spots animados)
        const spotLight1 = new THREE.SpotLight(0x44aaff, 0.8);
        spotLight1.position.set(3, 3, 2);
        spotLight1.angle = 0.4;
        spotLight1.penumbra = 0.5;
        spotLight1.distance = 10;
        scene.add(spotLight1);
        
        const spotLight2 = new THREE.SpotLight(0xff8844, 0.6);
        spotLight2.position.set(-2.5, 2.5, 3);
        spotLight2.angle = 0.5;
        scene.add(spotLight2);
        
        // Particulas de energia flutuantes
        const particleCount = 800;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 18;
            particlePositions[i*3+1] = Math.random() * 4;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 12 - 3;
        }
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({ color: 0x44ccff, size: 0.03, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);
        
        // --- MODELO GUNDAM PERSONALIZADO (com geometrias primitivas, estilo mecanizado) ---
        const gundamGroup = new THREE.Group();
        
        // Corpo principal (tórax)
        const torsoGeo = new THREE.BoxGeometry(0.9, 1.1, 0.7);
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x3a6ea5, metalness: 0.85, roughness: 0.25, emissive: 0x113355 });
        const torso = new THREE.Mesh(torsoGeo, metalMat);
        torso.position.y = 0.6;
        torso.castShadow = true;
        torso.receiveShadow = true;
        gundamGroup.add(torso);
        
        // Peitoral com detalhe amarelo
        const chestGeo = new THREE.BoxGeometry(0.95, 0.4, 0.65);
        const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffaa33, metalness: 0.7, roughness: 0.3 });
        const chestPlate = new THREE.Mesh(chestGeo, yellowMat);
        chestPlate.position.y = 0.95;
        gundamGroup.add(chestPlate);
        
        // Cabeça
        const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xdd3333, metalness: 0.9, emissive: 0x441111 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.35;
        gundamGroup.add(head);
        
        // Chifre / antena Gundam
        const crestGeo = new THREE.CylinderGeometry(0.08, 0.15, 0.25, 6);
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xffcc44, metalness: 0.95 });
        const crest = new THREE.Mesh(crestGeo, goldMat);
        crest.position.y = 1.7;
        crest.rotation.z = 0;
        gundamGroup.add(crest);
        
        const vFin = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.18, 4), goldMat);
        vFin.position.set(0, 1.68, 0.28);
        vFin.rotation.x = 0.2;
        gundamGroup.add(vFin);
        
        // Olhos (LED)
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00aaff, emissiveIntensity: 0.8 });
        const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), eyeMat);
        leftEye.position.set(-0.18, 1.48, 0.32);
        gundamGroup.add(leftEye);
        const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), eyeMat);
        rightEye.position.set(0.18, 1.48, 0.32);
        gundamGroup.add(rightEye);
        
        // Braços
        const armMat = new THREE.MeshStandardMaterial({ color: 0x2a5a8c, metalness: 0.8 });
        const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.9, 0.5), armMat);
        leftArm.position.set(-0.8, 1.0, 0);
        gundamGroup.add(leftArm);
        const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.9, 0.5), armMat);
        rightArm.position.set(0.8, 1.0, 0);
        gundamGroup.add(rightArm);
        
        // Omoplatas
        const shoulderMat = new THREE.MeshStandardMaterial({ color: 0xff5555, metalness: 0.6 });
        const leftShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), shoulderMat);
        leftShoulder.position.set(-1.0, 1.2, 0);
        gundamGroup.add(leftShoulder);
        const rightShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), shoulderMat);
        rightShoulder.position.set(1.0, 1.2, 0);
        gundamGroup.add(rightShoulder);
        
        // Mãos
        const handMat = new THREE.MeshStandardMaterial({ color: 0xccaa77 });
        const leftHand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), handMat);
        leftHand.position.set(-1.05, 0.55, 0.15);
        gundamGroup.add(leftHand);
        const rightHand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), handMat);
        rightHand.position.set(1.05, 0.55, 0.15);
        gundamGroup.add(rightHand);
        
        // Pernas
        const legMat = new THREE.MeshStandardMaterial({ color: 0x2a5a8c });
        const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.9, 8), legMat);
        leftLeg.position.set(-0.45, 0.1, 0);
        gundamGroup.add(leftLeg);
        const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.9, 8), legMat);
        rightLeg.position.set(0.45, 0.1, 0);
        gundamGroup.add(rightLeg);
        
        // Joelheiras
        const kneeMat = new THREE.MeshStandardMaterial({ color: 0xffaa55 });
        const leftKnee = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), kneeMat);
        leftKnee.position.set(-0.45, 0.35, 0.28);
        gundamGroup.add(leftKnee);
        const rightKnee = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), kneeMat);
        rightKnee.position.set(0.45, 0.35, 0.28);
        gundamGroup.add(rightKnee);
        
        // Mochila de propulsão (Drives)
        const backpackMat = new THREE.MeshStandardMaterial({ color: 0x4477aa, metalness: 0.9 });
        const boosterLeft = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.7), backpackMat);
        boosterLeft.position.set(-0.6, 0.85, -0.45);
        gundamGroup.add(boosterLeft);
        const boosterRight = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.7), backpackMat);
        boosterRight.position.set(0.6, 0.85, -0.45);
        gundamGroup.add(boosterRight);
        
        // Sabre de luz (efeito)
        const saberMat = new THREE.MeshStandardMaterial({ color: 0xff33aa, emissive: 0xff44aa, emissiveIntensity: 1.2 });
        const beamSaber = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.7, 8), saberMat);
        beamSaber.position.set(0.95, 1.1, 0.4);
        beamSaber.rotation.z = 0.3;
        gundamGroup.add(beamSaber);
        
        gundamGroup.position.set(0, 0, -0.5);
        gundamGroup.scale.set(0.9, 0.9, 0.9);
        scene.add(gundamGroup);
        
        // --- EFEITO DE BRILHO NOS OLHOS (pisca) ---
        let timeBlink = 0;
        
        // --- CHÃO DO HANGAR (grid tecnológico) ---
        const gridHelper = new THREE.GridHelper(15, 30, 0x33ccff, 0x225588);
        gridHelper.position.y = -0.3;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.45;
        scene.add(gridHelper);
        
        const floorPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(14, 12),
            new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 0.5, metalness: 0.7, transparent: true, opacity: 0.4 })
        );
        floorPlane.rotation.x = -Math.PI / 2;
        floorPlane.position.y = -0.35;
        floorPlane.receiveShadow = true;
        scene.add(floorPlane);
        
        // Círculos de luz no chão (decoração)
        const ringGeo = new THREE.TorusGeometry(0.9, 0.05, 32, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x44aaff, emissive: 0x2266aa });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -0.28;
        scene.add(ring);
        
        // Ambiente: pilares de hangar futurista
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, metalness: 0.8 });
        const pillarPositions = [[-3, 0, -2.5], [3, 0, -2.5], [-2.8, 0, 2.2], [2.8, 0, 2.2]];
        pillarPositions.forEach(pos => {
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.5, 0.6), pillarMat);
            pillar.position.set(pos[0], 0.8, pos[2]);
            pillar.castShadow = true;
            scene.add(pillar);
            const topLight = new THREE.PointLight(0x44aaff, 0.4, 6);
            topLight.position.set(pos[0], 1.8, pos[2]);
            scene.add(topLight);
        });
        
        // Naves pequenas suspensas (decor)
        const wingGroup = new THREE.Group();
        const wingMat = new THREE.MeshStandardMaterial({ color: 0xccaa77 });
        const wingBody = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.8), wingMat);
        wingGroup.add(wingBody);
        wingGroup.position.set(2.2, 2.1, -1.8);
        scene.add(wingGroup);
        
        // Animação de rotação das partículas e luzes
        let angle = 0;
        
        // Adicionar esferas de energia flutuantes ao redor do Gundam
        const energyOrbs = [];
        for (let i = 0; i < 6; i++) {
            const orbMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, emissive: 0x0088ff, emissiveIntensity: 0.6 });
            const orb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), orbMat);
            orb.userData = { offset: i };
            scene.add(orb);
            energyOrbs.push(orb);
        }
        
        // Efeito de fumaça/partículas de calor nos boosters
        const smokeParticles = [];
        const smokeMat = new THREE.PointsMaterial({ color: 0xff8833, size: 0.03, transparent: true, blending: THREE.AdditiveBlending });
        for (let i = 0; i < 150; i++) {
            const geom = new THREE.BufferGeometry();
            const posArr = new Float32Array(1 * 3);
            posArr[0] = (Math.random() - 0.5) * 0.2;
            posArr[1] = (Math.random() - 0.5) * 0.2;
            posArr[2] = (Math.random() - 0.5) * 0.2;
            geom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            const points = new THREE.Points(geom, smokeMat);
            points.userData = { life: Math.random() * 100 };
            scene.add(points);
            smokeParticles.push(points);
        }
        
        // Loop de animação customizada
        let lastTime = performance.now();
        
        function animateVR() {
            const now = performance.now();
            const delta = Math.min(1/30, (now - lastTime) / 1000);
            lastTime = now;
            
            // Atualizar controles orbitais (somente se não estiver em VR)
            if (!renderer.xr.isPresenting) {
                controls.update();
            }
            
            // Piscar olhos do gundam
            timeBlink += delta;
            if (timeBlink > 1.2) {
                eyeMat.emissiveIntensity = 1.5;
                if (timeBlink > 1.5) {
                    eyeMat.emissiveIntensity = 0.8;
                    if (timeBlink > 2.0) timeBlink = 0;
                }
            }
            
            // Movimento suave do sabre de luz
            beamSaber.rotation.z = 0.3 + Math.sin(now * 0.008) * 0.1;
            
            // Orbitar esferas de energia
            energyOrbs.forEach((orb, idx) => {
                const radius = 1.4;
                const speed = 0.8;
                const a = now * 0.002 + idx;
                orb.position.x = gundamGroup.position.x + Math.cos(a) * radius;
                orb.position.z = gundamGroup.position.z - 0.8 + Math.sin(a * 1.3) * radius;
                orb.position.y = gundamGroup.position.y + 0.7 + Math.sin(a * 2) * 0.3;
            });
            
            // Animar partículas flutuantes
            particles.rotation.y += 0.002;
            particles.rotation.x = Math.sin(now * 0.0005) * 0.1;
            
            // Animar anel no chão
            ring.rotation.z += 0.01;
            ring.material.emissiveIntensity = 0.4 + Math.sin(now * 0.003) * 0.2;
            
            // Efeito de "respiração" das luzes
            const intensity = 0.5 + Math.sin(now * 0.002) * 0.2;
            fillBlue.intensity = intensity;
            redLight.intensity = 0.4 + Math.sin(now * 0.0023) * 0.15;
            
            // Partículas de booster (movimento)
            smokeParticles.forEach(p => {
                p.userData.life += delta * 8;
                if (p.userData.life > 1) {
                    // reset
                    p.userData.life = 0;
                    const offsetX = (Math.random() - 0.5) * 0.6;
                    const offsetY = (Math.random() - 0.5) * 0.6;
                    const offsetZ = -0.7 + (Math.random() * 0.3);
                    p.position.set(gundamGroup.position.x + offsetX, gundamGroup.position.y + 0.5 + offsetY, gundamGroup.position.z - 0.9 + offsetZ);
                    p.material.color.setHex(Math.random() > 0.7 ? 0xff8844 : 0xff5533);
                } else {
                    p.position.y += 0.008;
                    p.position.x += (Math.random() - 0.5) * 0.01;
                }
            });
            
            // Pequena rotação dos ombros
            leftShoulder.rotation.x = Math.sin(now * 0.002) * 0.1;
            rightShoulder.rotation.x = Math.sin(now * 0.002 + 2) * 0.1;
            
            // Render via EffectComposer para VR (compatível)
            if (renderer.xr.isPresenting) {
                effectComposer.render();
            } else {
                effectComposer.render();
            }
            
            requestAnimationFrame(animateVR);
        }
        
        // Handle resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        }
        
        animateVR();
        
        // Mensagem console
        console.log('VR Gundam Hangar - Pronto para explorar!');
        
        // Adicionar efeito estrelas distantes
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1000;
        const starPos = [];
        for (let i = 0; i < starCount; i++) {
            starPos.push((Math.random() - 0.5) * 200);
            starPos.push((Math.random() - 0.5) * 80);
            starPos.push((Math.random() - 0.5) * 80 - 40);
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starGeometry, starMat);
        scene.add(stars);
    </script>
</body>
</html>
