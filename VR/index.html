<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Gundam 360° - Hotspots Interativos | Gaze Navigation</title>
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Rajdhani', 'Orbitron', monospace;
        }
        
        .vr-ui {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            font-family: monospace;
        }
        
        .info-panel {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 40px;
            border-left: 3px solid #00d4ff;
            border-right: 3px solid #ff3366;
            color: #ccf4ff;
            font-size: 14px;
            letter-spacing: 1px;
            font-weight: 500;
            pointer-events: auto;
        }
        
        .info-panel span {
            color: #ffaa44;
            font-weight: bold;
        }
        
        .controls-tip {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: #88ddff;
            font-family: monospace;
            backdrop-filter: blur(4px);
            z-index: 100;
            pointer-events: none;
            border: 1px solid #00aaff;
        }
        
        .vr-badge {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 30px;
            color: #ffcc44;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 2px;
            z-index: 100;
            backdrop-filter: blur(5px);
            border: 1px solid #ffaa33;
            pointer-events: none;
        }
        
        @media (max-width: 700px) {
            .info-panel { font-size: 10px; padding: 6px 12px; }
            .controls-tip { display: none; }
        }
    </style>
</head>
<body>
    <div class="vr-badge">
        ⚡ GUNDAM VR 360° | GAZE NAVIGATION ⚡
    </div>
    <div class="vr-ui">
        <div class="info-panel">
            👁️ <span>OLHE</span> para os pontos brilhantes (Hotspots) por 1.5 segundos para teleportar entre cenários
        </div>
    </div>
    <div class="controls-tip">
        🖱️ MOUSE: Arraste para olhar | 👁️ Gaze: Fixe o olhar nos círculos coloridos
    </div>

    <a-scene 
        background="color: #050510"
        raycaster="objects: .hotspot; far: 20"
        vr-mode-ui="enabled: true"
        device-orientation-permission-ui="enabled: true"
    >
        
        <!-- Câmera com cursor e gaze (fusing) -->
        <a-entity id="cameraWrapper" position="0 1.6 0">
            <a-camera id="camera" wasd-controls look-controls>
                <!-- Cursor com fusing (tempo de olhar) -->
                <a-entity 
                    id="cursor" 
                    cursor="fuse: true; fuseTimeout: 1500"
                    position="0 0 -0.8"
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                    material="color: #00ffff; shader: flat; opacity: 0.9"
                >
                    <!-- Anel de progresso do fusing -->
                    <a-entity
                        id="cursorRing"
                        geometry="primitive: ring; radiusInner: 0.023; radiusOuter: 0.035"
                        material="color: #ff44aa; opacity: 0.8; transparent: true"
                    ></a-entity>
                </a-entity>
            </a-camera>
        </a-entity>

        <!-- ============================================ -->
        <!-- COMPONENTE CUSTOMIZADO: SCENE MANAGER        -->
        <!-- Gerencia troca de texturas 360° e elementos  -->
        <!-- ============================================ -->
        <script>
            AFRAME.registerComponent('scene-manager', {
                schema: {
                    currentScene: { type: 'string', default: 'hangar' }
                },
                init: function() {
                    // URLs de texturas 360° confiáveis
                    this.scenes = {
                        hangar: {
                            skyTexture: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
                            elements: ['#hangarGroup', '#textHangar'],
                            hotspots: ['#hotspot1', '#hotspot2']
                        },
                        colony: {
                            skyTexture: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg',
                            elements: ['#colonyGroup', '#textColony'],
                            hotspots: ['#hotspotColony', '#hotspotColonyBack']
                        },
                        battlefield: {
                            skyTexture: 'https://threejs.org/examples/textures/planets/moon_1024.jpg',
                            elements: ['#battleGroup', '#textBattle'],
                            hotspots: ['#hotspotBattle', '#hotspotBattleBack']
                        }
                    };
                    
                    this.currentSceneKey = 'hangar';
                    this.skyEl = document.querySelector('a-sky');
                    this.initScenesGroups();
                    this.setupHotspotEvents();
                    
                    if (this.skyEl) {
                        this.skyEl.setAttribute('src', this.scenes.hangar.skyTexture);
                    }
                },
                
                initScenesGroups: function() {
                    Object.keys(this.scenes).forEach(key => {
                        this.scenes[key].elements.forEach(selector => {
                            const el = document.querySelector(selector);
                            if (el) {
                                el.setAttribute('visible', key === 'hangar');
                            }
                        });
                    });
                },
                
                setupHotspotEvents: function() {
                    const self = this;
                    
                    const setupHotspot = (id, targetScene) => {
                        const el = document.querySelector(id);
                        if (el) {
                            el.addEventListener('click', () => self.switchToScene(targetScene));
                        }
                    };
                    
                    setupHotspot('#hotspot1', 'colony');
                    setupHotspot('#hotspot2', 'battlefield');
                    setupHotspot('#hotspotColony', 'hangar');
                    setupHotspot('#hotspotColonyBack', 'battlefield');
                    setupHotspot('#hotspotBattle', 'colony');
                    setupHotspot('#hotspotBattleBack', 'hangar');
                },
                
                switchToScene: function(sceneKey) {
                    if (this.currentSceneKey === sceneKey) return;
                    
                    // Esconder grupo atual
                    this.scenes[this.currentSceneKey].elements.forEach(selector => {
                        const el = document.querySelector(selector);
                        if (el) el.setAttribute('visible', false);
                    });
                    
                    // Mostrar novo grupo
                    this.scenes[sceneKey].elements.forEach(selector => {
                        const el = document.querySelector(selector);
                        if (el) el.setAttribute('visible', true);
                    });
                    
                    // Trocar textura do céu
                    const newTexture = this.scenes[sceneKey].skyTexture;
                    if (this.skyEl) {
                        this.skyEl.setAttribute('src', newTexture);
                    }
                    
                    // Efeito de flash visual
                    const camera = document.querySelector('#camera');
                    if (camera) {
                        const flash = document.createElement('a-entity');
                        flash.setAttribute('geometry', 'primitive: plane; width: 2; height: 2');
                        flash.setAttribute('material', 'color: white; opacity: 0.5; transparent: true');
                        flash.setAttribute('position', '0 0 -0.5');
                        camera.appendChild(flash);
                        setTimeout(() => {
                            if (flash.parentNode) flash.parentNode.removeChild(flash);
                        }, 300);
                    }
                    
                    this.currentSceneKey = sceneKey;
                    console.log(`[SceneManager] Transição para: ${sceneKey}`);
                }
            });
            
            console.log('✅ Componente Scene Manager registrado');
        </script>

        <!-- ========== CENÁRIO 1: HANGAR PRINCIPAL (Gundam Base) ========== -->
        <a-entity id="hangarGroup" visible="true">
            <!-- Texto de boas-vindas -->
            <a-text 
                id="textHangar"
                value="⚡ RX-78-2 GUNDAM HANGAR ⚡\nOlhe para os portais azul e vermelho para viajar"
                color="#00ffff"
                align="center"
                position="0 1.2 -2.5"
                scale="0.8 0.8 0.8"
                width="4"
                side="double"
            ></a-text>
            
            <!-- Modelo Gundam completo -->
            <a-entity id="gundamModel" position="0 -0.5 -1.5" scale="0.8 0.8 0.8">
                <!-- Corpo principal -->
                <a-box color="#3a6ea5" metalness="0.8" roughness="0.3" position="0 0.6 0" width="0.9" height="1.1" depth="0.7"></a-box>
                <!-- Peitoral amarelo -->
                <a-box color="#ffaa33" metalness="0.7" position="0 0.95 0.05" width="0.95" height="0.35" depth="0.6"></a-box>
                <!-- Detalhe central -->
                <a-box color="#dd4444" metalness="0.5" position="0 0.75 0.38" width="0.4" height="0.2" depth="0.1"></a-box>
                <!-- Cabeça -->
                <a-box color="#dd3333" metalness="0.85" position="0 1.35 0" width="0.6" height="0.6" depth="0.6"></a-box>
                <!-- Olhos LED -->
                <a-sphere color="#00ffff" material="emissive: #00aaff" position="-0.16 1.48 0.32" radius="0.07"></a-sphere>
                <a-sphere color="#00ffff" material="emissive: #00aaff" position="0.16 1.48 0.32" radius="0.07"></a-sphere>
                <!-- Antena V -->
                <a-cone color="#ffcc44" metalness="0.9" position="0 1.72 0.15" radius-bottom="0.08" radius-top="0.01" height="0.2"></a-cone>
                <a-cone color="#ffcc44" metalness="0.9" position="-0.1 1.7 0.12" radius-bottom="0.05" radius-top="0.01" height="0.15" rotation="0 0 -15"></a-cone>
                <a-cone color="#ffcc44" metalness="0.9" position="0.1 1.7 0.12" radius-bottom="0.05" radius-top="0.01" height="0.15" rotation="0 0 15"></a-cone>
                <!-- Braços -->
                <a-box color="#2a5a8c" metalness="0.7" position="-0.78 1.05 0" width="0.4" height="0.9" depth="0.5"></a-box>
                <a-box color="#2a5a8c" metalness="0.7" position="0.78 1.05 0" width="0.4" height="0.9" depth="0.5"></a-box>
                <!-- Omoplatas -->
                <a-sphere color="#ff5555" metalness="0.6" position="-1.0 1.2 0" radius="0.32"></a-sphere>
                <a-sphere color="#ff5555" metalness="0.6" position="1.0 1.2 0" radius="0.32"></a-sphere>
                <!-- Sabre de luz -->
                <a-cylinder color="#ff44aa" material="emissive: #ff44aa" position="0.95 1.15 0.45" radius="0.045" height="0.65" rotation="0 0 25"></a-cylinder>
                <!-- Pernas -->
                <a-cylinder color="#2a5a8c" metalness="0.7" position="-0.48 0.25 0" radius="0.26" height="0.85"></a-cylinder>
                <a-cylinder color="#2a5a8c" metalness="0.7" position="0.48 0.25 0" radius="0.26" height="0.85"></a-cylinder>
                <!-- Joelheiras -->
                <a-sphere color="#ffaa55" position="-0.48 0.4 0.28" radius="0.18"></a-sphere>
                <a-sphere color="#ffaa55" position="0.48 0.4 0.28" radius="0.18"></a-sphere>
                <!-- Mochila propulsora -->
                <a-box color="#4477aa" metalness="0.8" position="-0.55 0.85 -0.5" width="0.5" height="0.6" depth="0.65"></a-box>
                <a-box color="#4477aa" metalness="0.8" position="0.55 0.85 -0.5" width="0.5" height="0.6" depth="0.65"></a-box>
                <!-- Anel de energia -->
                <a-torus color="#44aaff" radius="0.7" radius-tubular="0.03" position="0 0.7 0" rotation="90 0 0" material="emissive: #2288aa"></a-torus>
            </a-entity>
            
            <!-- Placa informativa -->
            <a-entity position="-1.3 0.3 -2.2">
                <a-box color="#112233" metalness="0.5" width="0.9" height="0.5" depth="0.05"></a-box>
                <a-text value="RX-78-2 GUNDAM" color="#ffaa44" align="center" position="0 0 0.04" scale="0.4 0.4 0.4"></a-text>
            </a-entity>
            
            <!-- Grade do piso -->
            <a-entity position="0 -0.7 -1.5">
                <a-grid size="8" divisions="20" color="#33aaff" opacity="0.3"></a-grid>
            </a-entity>
        </a-entity>

        <!-- ========== CENÁRIO 2: COLÔNIA ESPACIAL ========== -->
        <a-entity id="colonyGroup" visible="false">
            <a-text 
                id="textColony"
                value="🏛️ COLÔNIA ESPACIAL SIDE-7 🏛️\nCentro de pesquisa da Federação"
                color="#88ffaa"
                align="center"
                position="0 1.0 -2.8"
                scale="0.7 0.7 0.7"
                width="4"
                side="double"
            ></a-text>
            
            <!-- Estruturas da colônia -->
            <a-torus color="#44ffaa" radius="1.3" radius-tubular="0.05" position="0 0.5 -2" rotation="90 0 0" material="emissive: #22aa66"></a-torus>
            <a-torus color="#44ffaa" radius="1.6" radius-tubular="0.04" position="0 0.9 -2.2" rotation="90 0 0" material="emissive: #22aa66"></a-torus>
            
            <!-- Estações de pesquisa -->
            <a-cylinder color="#88aaff" metalness="0.7" radius="0.55" height="0.8" position="-1.3 0 -2"></a-cylinder>
            <a-sphere color="#66ccff" material="emissive: #2288aa" position="-1.3 0.55 -2" radius="0.35"></a-sphere>
            <a-cylinder color="#88aaff" metalness="0.7" radius="0.55" height="0.8" position="1.3 0 -2"></a-cylinder>
            <a-sphere color="#66ccff" material="emissive: #2288aa" position="1.3 0.55 -2" radius="0.35"></a-sphere>
            
            <!-- Texto de lore -->
            <a-text value="🔬 Laboratório de Novos Tipos - Pesquisa em andamento" color="#aaffdd" align="center" position="0 -0.4 -2.5" scale="0.5 0.5 0.5" width="3.5"></a-text>
            
            <!-- Satélite flutuante -->
            <a-entity position="-1.8 1.3 -1.8">
                <a-box color="#99ccff" width="0.35" height="0.35" depth="0.35"></a-box>
                <a-box color="#ffaa66" width="0.7" height="0.1" depth="0.1" position="0 0.25 0"></a-box>
                <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="10000" loop="true"></a-animation>
            </a-entity>
        </a-entity>

        <!-- ========== CENÁRIO 3: CAMPO DE BATALHA ========== -->
        <a-entity id="battleGroup" visible="false">
            <a-text 
                id="textBattle"
                value="🔥 CAMPO DE BATALHA - JABURO 🔥\nZona de combate intenso"
                color="#ff8866"
                align="center"
                position="0 1.0 -2.8"
                scale="0.7 0.7 0.7"
                width="4"
                side="double"
            ></a-text>
            
            <!-- Chamas/energia no chão -->
            <a-cylinder color="#ff4400" material="emissive: #ff2200" radius="0.45" height="0.08" position="-1.2 -0.2 -2">
                <a-animation attribute="scale" from="1 1 1" to="1.3 1 1.3" dur="600" dir="alternate" repeat="indefinite"></a-animation>
            </a-cylinder>
            <a-cylinder color="#ff4400" material="emissive: #ff2200" radius="0.45" height="0.08" position="1.2 -0.2 -2">
                <a-animation attribute="scale" from="1 1 1" to="1.3 1 1.3" dur="600" dir="alternate" repeat="indefinite"></a-animation>
            </a-cylinder>
            
            <!-- Destroços -->
            <a-box color="#666666" metalness="0.4" position="-0.9 0 -2.2" width="0.7" height="0.4" depth="0.6" rotation="20 30 0"></a-box>
            <a-box color="#888888" metalness="0.5" position="0.8 0.1 -1.9" width="0.6" height="0.3" depth="0.5" rotation="-15 45 10"></a-box>
            <a-sphere color="#555555" metalness="0.3" position="0 -0.2 -2.4" radius="0.25"></a-sphere>
            
            <!-- Esfera de energia vermelha -->
            <a-sphere color="#ff3366" material="emissive: #ff0044" radius="0.3" position="0 0.6 -2.5">
                <a-animation attribute="scale" from="0.8 0.8 0.8" to="1.2 1.2 1.2" dur="800" dir="alternate" repeat="indefinite"></a-animation>
            </a-sphere>
            
            <!-- Texto de alerta -->
            <a-text value="⚔️ MODO COMBATE ATIVADO - ALERTA MÁXIMO ⚔️" color="#ff4444" align="center" position="0 -0.7 -2.3" scale="0.5 0.5 0.5" width="4"></a-text>
        </a-entity>

        <!-- ========== HOTSPOTS INTERATIVOS (GAZE/FUSING) ========== -->
        
        <!-- Hotspot 1: Hangar -> Colônia -->
        <a-entity 
            id="hotspot1"
            class="hotspot"
            position="-1.8 0.9 -1.3"
            geometry="primitive: sphere; radius: 0.3"
            material="color: #00aaff; emissive: #0066cc; transparent: true; opacity: 0.85"
        >
            <a-text value="🌌 COLÔNIA" color="#ffffff" align="center" position="0 -0.55 0" scale="0.4 0.4 0.4"></a-text>
            <a-torus radius="0.38" radius-tubular="0.025" color="#88ddff" rotation="90 0 0"></a-torus>
            <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="4000" loop="true"></a-animation>
        </a-entity>
        
        <!-- Hotspot 2: Hangar -> Campo de Batalha -->
        <a-entity 
            id="hotspot2"
            class="hotspot"
            position="1.8 0.9 -1.3"
            geometry="primitive: sphere; radius: 0.3"
            material="color: #ff3366; emissive: #cc0044; transparent: true; opacity: 0.85"
        >
            <a-text value="⚔️ BATALHA" color="#ffffff" align="center" position="0 -0.55 0" scale="0.4 0.4 0.4"></a-text>
            <a-torus radius="0.38" radius-tubular="0.025" color="#ff8899" rotation="90 0 0"></a-torus>
            <a-animation attribute="rotation" from="0 0 0" to="0 -360 0" dur="4000" loop="true"></a-animation>
        </a-entity>

        <!-- Hotspot Colônia -> Hangar -->
        <a-entity 
            id="hotspotColony"
            class="hotspot"
            position="-1.8 0.8 -2.2"
            geometry="primitive: sphere; radius: 0.26"
            material="color: #44ddff; emissive: #2288aa; transparent: true; opacity: 0.8"
        >
            <a-text value="↩️ HANGAR" color="#ffffff" align="center" position="0 -0.45 0" scale="0.35 0.35 0.35"></a-text>
        </a-entity>

        <!-- Hotspot Colônia -> Batalha -->
        <a-entity 
            id="hotspotColonyBack"
            class="hotspot"
            position="1.8 0.8 -2.2"
            geometry="primitive: sphere; radius: 0.26"
            material="color: #ff8866; emissive: #aa3355; transparent: true; opacity: 0.8"
        >
            <a-text value="🔥 BATALHA" color="#ffffff" align="center" position="0 -0.45 0" scale="0.35 0.35 0.35"></a-text>
        </a-entity>

        <!-- Hotspot Battlefield -> Colônia -->
        <a-entity 
            id="hotspotBattle"
            class="hotspot"
            position="-1.8 0.6 -2.2"
            geometry="primitive: sphere; radius: 0.26"
            material="color: #66ffaa; emissive: #228866; transparent: true; opacity: 0.8"
        >
            <a-text value="🏛️ COLÔNIA" color="#ffffff" align="center" position="0 -0.45 0" scale="0.35 0.35 0.35"></a-text>
        </a-entity>

        <!-- Hotspot Battlefield -> Hangar -->
        <a-entity 
            id="hotspotBattleBack"
            class="hotspot"
            position="1.8 0.6 -2.2"
            geometry="primitive: sphere; radius: 0.26"
            material="color: #44aaff; emissive: #2266aa; transparent: true; opacity: 0.8"
        >
            <a-text value="🏭 HANGAR" color="#ffffff" align="center" position="0 -0.45 0" scale="0.35 0.35 0.35"></a-text>
        </a-entity>

        <!-- Iluminação Global -->
        <a-light type="ambient" color="#222233" intensity="0.7"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.9" position="2 3 2"></a-light>
        <a-light type="point" color="#4488ff" intensity="0.5" position="-1 2 -1"></a-light>
        <a-light type="point" color="#ff8844" intensity="0.4" position="1 1.5 -1.5"></a-light>

        <!-- Sky 360° inicial -->
        <a-sky id="mainSky" src="https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg" radius="5000"></a-sky>
        
        <!-- Scene Manager -->
        <a-entity id="sceneManager" scene-manager="currentScene: hangar"></a-entity>
        
    </a-scene>

    <script>
        window.addEventListener('load', () => {
            const hotspots = document.querySelectorAll('.hotspot');
            hotspots.forEach(hotspot => {
                hotspot.addEventListener('mouseenter', () => {
                    hotspot.setAttribute('scale', '1.1 1.1 1.1');
                });
                hotspot.addEventListener('mouseleave', () => {
                    hotspot.setAttribute('scale', '1 1 1');
                });
            });
            console.log('✅ VR Gundam 360° - 3 cenários, hotspots com gaze, navegação funcional!');
        });
    </script>
</body>
</html>
